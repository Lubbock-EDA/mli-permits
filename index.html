<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- makes the page size itself properly on phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MLI Grant Program Name</title>
  
  <!-- Leaflet (the map library), LEDA's heading font, and OUR shared styles -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@500;700&display=swap">
  <link rel="stylesheet" href="style.css">
  
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="common.js"></script>   <!-- our shared code: colors, money, map, stats -->
</head>
<body>

  <header>
    <!-- Edit these two lines to whatever the program is officially called -->
	<h1>MLI Grant Program Name</h1>
	<p>Grants to property owners renovating buildings in four Lubbock districts</p>
  </header>
  
  <main>
    <!-- The four number cards. common.js fills in each one by its id. -->
	<div class="stats">
	  <div class="stat"><div class="statNumber" id="statCount">...</div><div class="statLabel">Grants Awarded
	</div></div>
	  <div class="stat"><div class="statNumber" id="statGranted">...</div><div class="statLabel">Total Granted
	</div></div>
	  <div class="stat"><div class="statNumber" id="statInvested">...</div><div class="statLabel">Private Investment
	</div></div>
	  <div class="stat"><div class="statNumber" id="statPerDollar">...</div><div class="statLabel">Invested per $1 Granted
	</div></div>
	  </div>
	  
	  <div id="map"></div>
	  
	  <h2>Explore Each Program</h2>
	  
	  <!-- Empty for now; the script below adds one button per area -->
	  <div class="areaButtons" id="areaButtons"></div>
	</main>
	
	<script>
	  const map = makeMap('map'); 
	  
	  loadGrants().then(grants => {
	    // Numbers for all Grants
		fillStats(grants);
		
		// Draw every grant, then zoom the map so they all fit
		const layer = drawGrants(map, grants);
		map.fitBounds(layer.getBounds(), { padding: [20, 20] }); 
		
		// One button per area, in the order listed in common.js
		const box = document.getElementById('areaButtons'); 
		Object.entries(AREAS).forEach(([key, area]) => {
		  const mine = grants.filter(g => g.properties.areaKey === key); 
		  const granted = mine.reduce((sum, g) => sum + (g.properties.grant || 0), 0);
		  
		  const button = document.createElement('a');
		  button.className = 'areaButton'; 
		  button.href = 'program.html?area=' + key;     // tells program.html which area to show
		  button.style.borderLeftColor = area.color;    // colored stripe = this area's map color
		  button.innerHTML = `
		    <div class="areaName">${area.name}</div>
			<div class="areaInfo">${mine.length} ${mine.length === 1 ? 'grant' : 'grants'} &middot; 
			${shortMoney(granted)} granted</div>
		  `; 
		  box.appendChild(button); 
		}); 
	  }); 
	</script>
  </body>
  </html>
